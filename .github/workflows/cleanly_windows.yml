name: Cleanly Windows

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths: &cleanly-paths
      - 'cleanly/**'
      - 'cleanly.spec'
      - 'requirements-cleanly.txt'
      - 'bleachbit/**'
      - 'cleaners/**'
      - 'tests/TestCleanly.py'
      - '.github/workflows/cleanly_windows.yml'
  pull_request:
    paths: *cleanly-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # zizmor: ignore[cache-poisoning] the build is uploaded as a CI artifact only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cleanly.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-cleanly.txt -r requirements-test.txt

      - name: Test the Cleanly core
        run: python -m pytest -q tests/TestCleanly.py

      - name: Build Cleanly.exe
        run: pyinstaller --noconfirm cleanly.spec

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cleanly-windows
          path: dist/Cleanly
          retention-days: 14
